<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lacuna">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png">
  <title>Lacuna — Studio control</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark"></span><b>Lacuna</b><span class="sub">the Studio's control plane · :1138</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="control" class="on">Control</button>
      <button data-tab="errors">Errors</button>
      <button data-tab="logs">Logs</button>
      <button data-tab="graphs">Graphs</button>
      <button data-tab="mentat">Mentat</button>
      <button data-tab="terminal">Terminal</button>
      <button data-tab="deploys">Deploys</button>
      <button data-tab="battery">Battery</button>
      <button data-tab="runbooks">Runbooks</button>
      <button data-tab="audit">Audit</button>
    </nav>
    <div class="status"><button id="askLacuna" class="ask" title="Talk to Lacuna ( / )"><span class="mark"></span>Ask Lacuna</button><button id="phoneCut" class="ask" title="The thumb-first cut, for a phone">Phone view</button><span id="clock"></span><button id="bell" class="bell" title="Alerts">●<b id="bellN">0</b></button></div>
  </header>
  <div id="alertbar" class="alertbar" hidden></div>
  <main id="main">
    <section class="pane on" id="pane-control"></section>
    <section class="pane" id="pane-errors"></section>
    <section class="pane" id="pane-logs"></section>
    <section class="pane" id="pane-graphs"></section>
    <section class="pane" id="pane-mentat"></section>
    <section class="pane" id="pane-terminal"></section>
    <section class="pane" id="pane-deploys"></section>
    <section class="pane" id="pane-battery"></section>
    <section class="pane" id="pane-runbooks"></section>
    <section class="pane" id="pane-audit"></section>
  </main>
  <dialog id="confirm" class="confirm"><form method="dialog"><h3 id="confirmTitle"></h3><p id="confirmBody"></p>
    <menu><button value="no">Cancel</button><button value="yes" class="danger" id="confirmYes">Yes, do it</button></menu></form></dialog>
  <script src="/vendor/d3.min.js"></script>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
