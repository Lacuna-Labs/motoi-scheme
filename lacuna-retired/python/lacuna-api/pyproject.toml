[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna-api"
version = "0.1.0"
description = "Lacuna's web/console-facing HTTP surface — /ctl/* endpoints for the Lacuna dashboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Lacuna Labs"}]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "lacuna",
]

[project.optional-dependencies]
ssl = ["certifi"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lacuna_api*"]
