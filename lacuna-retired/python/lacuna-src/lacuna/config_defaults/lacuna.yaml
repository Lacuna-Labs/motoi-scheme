# ~/.lacuna/lacuna.yaml — Lacuna orchestrator configuration.
#
# Human-edit me. Reload by restarting `lacuna up`. Validate with
# `lacuna config validate`. Show effective values with `lacuna config show`.
#
# Precedence: env vars > this file > hardcoded defaults.
#
# Schema version. Bumped only on incompatible changes; the loader tolerates
# missing keys (uses defaults) so adding fields is non-breaking.
version: 1


# ── Ollama (local LLM transport) ────────────────────────────────────────────
ollama:
  enabled: true

  # Where Ollama listens. Override with LACUNA_LOCAL_URL.
  url: http://localhost:11434

  models:
    # Chat / completion model. Pulled by `lacuna ai install`.
    # Override with LACUNA_LOCAL_MODEL.
    chat:  qwen2.5:3b-instruct

    # Embedding model used by RAG (lacuna ai rag build).
    embed: nomic-embed-text

  # When `lacuna ai install` runs, automatically `ollama pull` each model
  # above. Set to false if you'd rather pull manually.
  auto_pull_on_install: true


# ── Backend routing ─────────────────────────────────────────────────────────
backends:
  # Order Lacuna tries backends. First reachable wins. `local` = Ollama
  # (configured above). Cloud entries require their respective API key in
  # the environment or the-api/.env. `echo` is the offline fallback.
  #
  # Override with LACUNA_LLM_BACKEND=<name> in env (forces a single backend).
  precedence:
    - local
    - deepseek
    - anthropic
    - openai
    - echo


# ── Copilot mode ────────────────────────────────────────────────────────────
# When enabled, a more-capable LLM (Claude / GPT) gives Lacuna instructions
# and Lacuna executes — translating to shell commands, file edits, API calls.
# When disabled (default), Lacuna spawns its own anonymous team locally
# using the roster in team.yaml.
copilot:
  enabled: false

  # Which provider drives copilot mode when enabled.
  # Options: "claude" | "openai" | null
  provider: null

  # Self-hosted bridge URL, when present.
  endpoint: null


# ── Team roster ─────────────────────────────────────────────────────────────
team:
  # Persona definitions live in team.yaml.
  roster_file: team.yaml

  anonymous:
    # When no real persona is named AND copilot is off, Lacuna spawns the
    # team locally with anonymous near-random names (e.g. "engineer-2742").
    # Roles are filled but identities aren't impersonated.
    enabled: true

    # Lock the random seed for reproducible session identities. null = fresh
    # each run.
    name_seed: null


# ── Playbooks ───────────────────────────────────────────────────────────────
# Declarative orchestration. Each *.yaml in `dir` is a runnable workflow.
# Run via: `lacuna run <playbook-name>`.
playbooks:
  dir: playbooks

  # Whitelist of allowed shell programs in playbook steps. Empty = any.
  # When non-empty, playbooks may only invoke listed binaries.
  allowlist: []
