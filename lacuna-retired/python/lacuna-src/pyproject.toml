[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna"
version = "0.4.0"
description = "Lacuna Labs dev environment orchestrator. Mind the gaps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "doveman", email = "doveman@gmail.com" }]
keywords = ["cli", "tui", "dev-environment", "orchestrator", "ollama", "yaml"]

dependencies = [
    "textual>=0.80,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[project.scripts]
lacuna = "lacuna.cli:main"

[tool.setuptools.packages.find]
include = ["lacuna*"]

[tool.setuptools.package-data]
"lacuna" = [
    "config_defaults/*.yaml",
    "config_defaults/playbooks/*.yaml",
    "persona_prompt.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
