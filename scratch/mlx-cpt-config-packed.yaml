# Motoi CPT ZERO — full-parameter continued pretraining — PACKED REFIRE
#
# 2026-08-08: the first fire consumed ~/.forge/data/motoi-cpt-zero/train.jsonl,
# which is the RAW ~227-token record file — the BPE packs live alongside it as
# train-packed.jsonl and were never loaded (mlx_lm loads by the fixed names
# train.jsonl/valid.jsonl). Result: 1.15M of 87.8M planned token-passes (1.3%).
# This config points at the staged dir where the PACKS are named train.jsonl/
# valid.jsonl. Gated by scratch/cpt_fire_gates.py (pre + post) — see
# forge-refire-cpt-zero-packed.sh (which copies this file to
# ~/.forge/projects/motoi-cpt-zero/ before firing).
#
# Corpus (unchanged, emit 2026-08-07): 10,501 train packs + 217 valid packs
# @ 4096 BPE (96.5% util, 0 oversized), ~43.9M tokens.
#
# Iter arithmetic (unchanged):
#   iters = ceil(10501 × 2 epochs / (1 × 4 accum)) = 5,251
# Honest wall-clock: ~560-650 tok/s observed on this box → 87.8M tokens =
# ~1.6-1.8 days, NOT the 45 min the original header claimed.

model: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
train: true
fine_tune_type: "full"
optimizer: "adamw"

data: /Users/alfred/.forge/data/motoi-cpt-zero-packed
seed: 59                        # odd prime — CPT ZERO baseline

num_layers: -1

batch_size: 1
grad_accumulation_steps: 4

# 2 epochs.
# 2026-08-08 CORRECTION: the old 5251 came from dividing by grad_accum, but
# mlx_lm's trainer (tuner/trainer.py:319) consumes ONE batch per iteration and
# only applies the optimizer update every grad_accum-th iteration. Accumulation
# does not multiply data seen per iter. Confirmed empirically: iter 10 reported
# Trained Tokens 39,722 = 3,972/iter = exactly one pack. So 5251 iters was 0.5
# epochs, not 2. Correct value is packs x epochs = 10501 x 2.
iters: 21002

# LR schedule — full-parameter, lower than SFT
learning_rate: 3.0e-5
lr_schedule:
  name: "cosine_decay"
  warmup: 1050                  # 5% of 21002
  arguments: [3.0e-5, 21002, 3.0e-6]

max_seq_length: 4224            # packs are <=4096 + headroom for BOS/EOS/sep so nothing truncates

# 2026-08-08: 4224-token packs are ~18x the misfire's 227-token records, so
# activation memory is what pins this 32GB box (~14GB wired, thrashes to a halt
# at iter 0). Recomputes activations in the backward pass instead of holding
# them — identical math, ~20-30% slower per step.
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 100
val_batches: 25
save_every: 2000                # ~11 ckpts x 2.4GB = 26GB; 500 would be 101GB on 156GB free

adapter_path: /Users/alfred/.forge/runs/motoi-cpt-zero/adapter/
